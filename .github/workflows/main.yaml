name: build-and-test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  runtime-node20:
    name: Packed production runtime (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build tooling Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install and build
        run: npm ci && npm run build
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Runtime Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install production package and smoke test
        run: |
          mkdir "$RUNNER_TEMP/runtime-smoke"
          cd "$RUNNER_TEMP/runtime-smoke"
          npm init -y
          npm install --omit=dev "$RUNNER_TEMP/"*.tgz
          ./node_modules/.bin/jira-ctrf --help
